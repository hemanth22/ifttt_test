version: 2.1
orbs:
  python: circleci/python@2.0.3

jobs:
  build_and_test: # this can be any name you choose
    executor: python/default
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip
      - run:
          name: Print python version
          command: python -V

      - run:
          name: Download python dependencies
          command: pip3 install -r requirements.txt

      - run:
          name: Get Date
          command: date

      - run:
          name: Execute VoIP Call
          command: python python_ifttt_3.py

      - run:
          name: present workdirectory
          command: pwd

workflows:
  ifttt_app:
    jobs:
      - build_and_test
    triggers:
      - schedule:
          cron: "45 6 * * 1,2,3,4,5"
          filters:
            branches:
              only:
                - ifttt_timesheet
